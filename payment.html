<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - ID Fashions</title><link rel="stylesheet" href="styles/style.css"><script src="scripts/cart.js" defer></script>
</head>
<body><div class="page"><div class="site-container">
  <header class="store-header"><a class="store-logo" href="index.html">ID Fashions</a><a class="cart-link" href="cart.html">Cart <span id="cart-count">0</span></a></header>
  <main class="payment-page">
    <h1 class="checkout-title">Payment</h1>
    <form class="payment-form" onsubmit="event.preventDefault(); alert('Demo payment submitted. Connect a real payment gateway before accepting payments.');">
      <label>Full Name<input type="text" required></label>
      <label>Email Address<input type="email" required></label>
      <label>Card Number<input type="text" inputmode="numeric" maxlength="19" placeholder="1234 5678 9012 3456" required></label>
      <div class="payment-row"><label>Expiry Date<input type="text" placeholder="MM/YY" required></label><label>CVV<input type="password" inputmode="numeric" maxlength="4" required></label></div>
      <button class="checkout-button" type="submit">Pay Now</button>
      <a class="back-link" href="cart.html">← Back to Cart</a>
    </form>
  </main>
</div></div></body></html>
